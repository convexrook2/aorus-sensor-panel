<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet previews</title><link rel="stylesheet" href="review.css">
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script></head>
<body><canvas aria-label="3D ship model. Drag to orbit; scroll to zoom."></canvas>
<header><div><small>Fleet studio / latest studies</small><h1 id="title">Loading preview</h1></div><div class="select-wrap"><label class="sr-only" for="ship">Model</label><select id="ship"></select><button id="references" aria-expanded="false" aria-controls="reference-panel">References</button></div></header>
<nav aria-label="Camera views"><button data-view="hero" aria-pressed="true">Three-quarter</button><button data-view="front">Front</button><button data-view="side">Side</button><button data-view="rear">Back</button><button data-view="opposite">Opposite side</button><button data-view="aft">Drive end</button><button data-view="nose">Bow end</button><button data-view="rim" id="rim-view" hidden>Rim close-up</button></nav>
<aside id="reference-panel" hidden><div class="panel-head"><h2>Reference views</h2><button id="close-references" aria-label="Close reference views">Close</button></div><p id="reference-note"></p><div id="reference-images"></div><a id="artist" target="_blank" rel="noopener noreferrer">Open artist / source</a></aside>
<footer><div class="controls"><select id="quality" aria-label="Rendering quality"><option value="efficient">Efficient · on demand</option><option value="full">Full shading</option></select><button id="rotate" aria-pressed="true">Pause rotation</button><button id="ship-lights" aria-pressed="true">Ship lights on</button><button id="plumes" aria-pressed="false">Engine plumes off</button><select id="lighting" aria-label="Lighting rig"><option value="studio">Studio light</option><option value="cinema">Cinematic light</option><option value="ship">Ship lights only</option></select><button id="portal" aria-pressed="true" hidden>Portal on</button><button id="effect" aria-pressed="true" hidden>Animate field</button><select id="surface" aria-label="Surface display"><option value="materials">Original materials</option><option value="clay">Clay / shape</option><option value="normals">Normals</option><option value="wire">Wireframe</option></select><button id="ao" aria-pressed="true">Cavity shading</button><button id="before" aria-pressed="false" hidden>Previous version</button><button id="reset">Reset view</button></div><p class="help">Drag to orbit · Wheel to zoom · Right-drag to pan<br><output id="motion" aria-live="off">Loading</output><br><output id="engine-state" aria-live="polite"></output></p><details><summary>Study status &amp; credits</summary><p id="note"></p><p id="credit"></p><small id="technical"></small></details></footer>
<div id="status" role="status">Loading model…</div>
<script type="module" src="review.js"></script></body></html>
